services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      # Distributed builds are unsigned until the Grafana catalog reviews this
      # plugin and assigns it a signature level, so Grafana has to be told to
      # load it — with an empty list here it refuses, and the panel simply never
      # appears. Once a community signature is issued, empty this again: that is
      # the only honest test that the signature itself works.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: shashankbudem-bharatchoropleth-panel
