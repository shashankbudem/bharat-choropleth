name: observatory_flutter
description: The India Development Observatory, rendered natively with bharat_choropleth.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  bharat_choropleth:
    path: ../../../packages/flutter
  # For the live-temperature indicator only. The published package itself takes
  # no network dependency; this is the example app asking a weather API.
  http: ^1.2.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Populated from the repository by scripts/prepare-observatory-flutter-assets.mjs,
  # which `pnpm build:observatory` runs. They are generated data, so they are not
  # committed — see examples/observatory/README.md.
  assets:
    - assets/india-observatory.json
    - assets/region-centroids.json
    - assets/historical/states.topo.json
    - assets/current/states.topo.json
    - assets/historical-districts/
    - assets/current-districts/
    - assets/subdistricts/
