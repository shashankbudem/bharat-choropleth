# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

# This workflow only runs in the standalone plugin repository, which is where
# panel releases are cut. In the monorepo it sits under plugins/ and GitHub
# never reads it, because only .github/workflows at the repository root is live.
on:
  push:
    tags:
      # Plain `v1.0.1` is the convention here: this repository holds one thing,
      # so there is nothing for a prefix to disambiguate. `panel-v*` is matched
      # too because the first release was tagged `panel-v1.0.0`, carried over
      # from the monorepo where the prefix keeps panel tags apart from the four
      # package ones — and a tag that looks like it publishes but silently does
      # not is worse than matching two patterns.
      - 'v*'
      - 'panel-v*'

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        # Uncomment to enable plugin signing
        # (For more info on how to generate the access policy token see https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token)
        #with:
        # Make sure to save the token in your repository secrets
        #policy_token: $
        # Usage of GRAFANA_API_KEY is deprecated, prefer `policy_token` option above
        #grafana_token: $
